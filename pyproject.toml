[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyjae"
version = "0.2.2"
description = "Joint Autoencoders (JAE1 channel-split, JAE2 JEPA) for neural signal denoising and manifold learning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ege Altan", email = "37878962+egealtan@users.noreply.github.com"}
]
keywords = [
    "neuroscience",
    "neural signals",
    "denoising",
    "autoencoder",
    "jepa",
    "self-supervised-learning",
    "manifold",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.5.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/egealtan/pyjae"
Repository = "https://github.com/egealtan/pyjae"
"Bug Tracker" = "https://github.com/egealtan/pyjae/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyjae = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=pyjae --cov-report=term-missing --cov-report=html"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
# ML naming conventions: X for data matrices, B/C/T/D for tensor dims,
# F for torch.nn.functional. These are idiomatic and used throughout.
ignore = ["E501", "N803", "N806", "N812"]

